plugins {
    id "java"
    id "org.springframework.boot" version "${springbootVersion}" apply false
    id "io.spring.dependency-management" version "${springDependencyManagementVersion}" apply false
    id "com.github.spotbugs" version "${spotbugsVersion}" apply false
}

group = 'de.schwarz.jobs.interview'
version = '0.0.1-SNAPSHOT'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

allprojects {
    repositories {
        mavenCentral()
    }
}

apply from: 'checkstyle.gradle'
apply from: 'spotbugs.gradle'
apply from: 'subprojects-plugins.gradle'
apply from: 'allprojects-repositories.gradle'
apply from: 'allprojects-dependencylocking.gradle'
